# One-off check that the free street-name service answers web pages (CORS) from GitHub's network.
name: Map services check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/map-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "--- photon"; curl -s -D - -H "Origin: https://automateeaseai-arch.github.io" "https://photon.komoot.io/reverse?lat=6.6018&lon=3.3515&lang=en" | grep -iE "^HTTP|access-control-allow-origin|\"street\"|\"name\"" | cut -c1-300
